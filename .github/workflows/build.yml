name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AltStore_Android_Native_Source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: AltStore_Android_Native
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AltStore_Android_Native/app/build/outputs/apk/debug/app-debug.apk
